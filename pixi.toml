[workspace]
name = "sqlcompyre"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
exclude-newer = "7d"
preview = ["pixi-build"]

[package]
name = "sqlcompyre"

[package.build.backend]
name = "pixi-build-python"
version = "*"

[package.host-dependencies]
python = ">=3.11"
hatchling = "*"
uv = "*"

[dependencies]
sqlcompyre = { path = "." }
python = ">=3.11"
# Dependencies
click = "*"
pydantic = ">=2.0"
pyyaml = "*"
sqlalchemy = ">=2"
tabulate = "*"
tqdm = "*"
types-pyyaml = "*"
types-tabulate = "*"
# Database Dependencies: MSSQL
unixodbc = "*"
# Database Dependencies: DuckDB
duckdb-engine = "*"
python-duckdb = "*"

[feature.docs.dependencies]
make = "*"
numpydoc = "*"
sphinx = "*"
sphinx_rtd_theme = "*"
sphinxcontrib-apidoc = "*"

[feature.docs.tasks]
docs = "cd docs && make html"
readthedocs = "rm -rf $READTHEDOCS_OUTPUT/html && cp -r docs/_build/html $READTHEDOCS_OUTPUT/html"

[feature.test.dependencies]
mypy = "*"
pandas = "*"
polars = "*"
pyodbc = "*"
pytest = ">=6,<8"  # Adds --import-mode option
pytest-console-scripts = "*"
pytest-cov = "*"
pytest-lazy-fixture = "*"
python-dotenv = "*"
sqlalchemy-utils = "*"

[feature.test.tasks]
test = "python -m pytest"
test-coverage = "python -m pytest --cov=sqlcompyre --cov-report=xml --cov-report=term-missing"

[feature.build.dependencies]
python = "*"
hatchling = "*"
python-build = "*"
twine = ">=6"

[feature.build.tasks]
build-wheel = "python -m build --no-isolation ."
check-wheel = "twine check dist/*"

[feature.lint.dependencies]
lefthook = "*"
insert-license-header = "*"
ruff = "*"
prettier = "*"
tombi = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"

[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[environments]
default = ["test", "build", "lint"]
build = ["build"]
docs = ["docs"]
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
