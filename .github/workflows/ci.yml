name: CI
on:
  pull_request:
  push:
    branches: [main]

# Automatically stop old builds on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      - name: Run linting
        run: pixi run lint
        env:
          CLICOLOR_FORCE: 1

  pytest:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: Passw0rd
        ports:
          - 1433:1433
    strategy:
      fail-fast: false
      matrix:
        environment: [py311, py312, py313]
        database: [sqlite, mssql, duckdb]
        include:
          - database: sqlite
            connection-string: sqlite:///test.sqlite3
          - database: mssql
            connection-string: mssql+pyodbc://sa:Passw0rd@localhost:1433/master?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no
          - database: duckdb
            connection-string: duckdb:///test.duckdb
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install msodbcsql18
        if: matrix.database == 'mssql'
        run: sudo ACCEPT_EULA=Y apt-get install msodbcsql18 -y
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          environments: ${{ matrix.environment }}
          activate-environment: true
      - name: Run pytest
        run: pixi run test-coverage --color=yes
        env:
          DB_CONNECTION_STRING: ${{ matrix.connection-string }}
